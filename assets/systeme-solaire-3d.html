<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070a24"><title>Système solaire 3D</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#fff;background:#070a24}#app{position:fixed;inset:0;background:linear-gradient(#070a24,#151a41);touch-action:none}#app.day{background:linear-gradient(#665dd2,#948bea)}canvas{position:absolute;inset:0}.glass{background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff}.btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px}.stack{position:absolute;display:flex;flex-direction:column;gap:8px}.top{top:calc(14px + env(safe-area-inset-top));z-index:3}.left{left:14px}.right{right:14px}.row{display:flex}.pill{border:0;height:32px;border-radius:16px;padding:0 14px}.controls{top:calc(76px + env(safe-area-inset-top));left:14px}.dock{position:absolute;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:3}.dock .btn{width:52px;height:52px}.info{flex:1;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center}.name{font-weight:600}.sub{font-size:13px;opacity:.6}.labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;transform:translate(-50%,-130%);font-size:12px;font-weight:600;text-shadow:0 1px 6px #000;display:none}.timeline{position:absolute;right:26px;top:124px;bottom:104px;width:2px;background:#ffffff2b;z-index:3}.handle{position:absolute;right:-12px;top:50%;transform:translateY(-50%);background:#fff;color:#15173a;border-radius:17px;padding:8px 10px;white-space:nowrap;font-size:12px;font-weight:600}.boot{position:absolute;inset:0;display:grid;place-items:center;opacity:.6;z-index:2}
</style></head><body><div id="app"><div id="boot" class="boot">Chargement du moteur 3D…</div><div id="labels" class="labels"></div><div id="compass" class="top left btn glass">N</div><div class="top right row"><button class="btn glass" id="toggleLabels">◎</button><button class="btn glass" id="reset">⋯</button></div><div class="controls stack"><button class="btn glass" id="zin">+</button><button class="btn glass" id="zout">−</button><button class="btn glass" id="back" style="display:none">↩</button></div><button id="now" class="top right pill glass" style="top:76px">Maintenant</button><div id="timeline" class="timeline"><div id="handle" class="handle">—</div></div><div class="dock"><button class="btn glass" id="theme">☀</button><div class="info glass"><div><span id="iname" class="name">Système solaire</span> <span id="zoom"></span></div><div id="sub" class="sub">Vue d’ensemble</div></div><button class="btn glass" id="play">Ⅱ</button></div></div><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script>
(()=>{const app=document.getElementById('app'),boot=document.getElementById('boot'),labelsBox=document.getElementById('labels'),compass=document.getElementById('compass'),iname=document.getElementById('iname'),sub=document.getElementById('sub'),zoomText=document.getElementById('zoom'),back=document.getElementById('back'),handle=document.getElementById('handle');if(!window.THREE){boot.textContent='Connexion requise pour charger le moteur 3D';return}const TAU=Math.PI*2,J2000=Date.UTC(2000,0,1,12),bodies=[['Mercure',.387,.2408,252.3,.8,0x9c9186],['Vénus',.723,.6152,181.98,1.1,0xd9bd8c],['Terre',1,1,100.46,1.2,0x3f7fc4],['Mars',1.524,1.881,355.45,.95,0xb85f42],['Jupiter',5.203,11.86,34.4,2.8,0xc9a67e],['Saturne',9.537,29.45,49.94,2.4,0xd8c297],['Uranus',19.19,84.02,313.23,1.8,0x93cbd4],['Neptune',30.07,164.8,304.88,1.75,0x4a63c4]].map((b,i)=>({n:b[0],a:b[1],p:b[2],L:b[3],size:b[4],c:b[5],r:12+Math.pow(b[1]/30.07,.55)*88,i}));const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;app.insertBefore(renderer.domElement,app.firstChild);scene.add(new THREE.AmbientLight(0x52608f,.45));const sunLight=new THREE.PointLight(0xffffff,2200,500);scene.add(sunLight);const sun=new THREE.Mesh(new THREE.SphereGeometry(3.3,32,24),new THREE.MeshBasicMaterial({color:0xffd67b}));scene.add(sun);const halo=new THREE.Mesh(new THREE.SphereGeometry(5.5,24,16),new THREE.MeshBasicMaterial({color:0xffd67b,transparent:true,opacity:.12,depthWrite:false}));scene.add(halo);const stars=new THREE.BufferGeometry(),pos=[];for(let i=0;i<700;i++){const r=220+Math.random()*300,a=Math.random()*TAU,z=Math.random()*2-1,s=Math.sqrt(1-z*z);pos.push(r*s*Math.cos(a),r*z,r*s*Math.sin(a))}stars.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xffffff,size:.7,transparent:true,opacity:.7})));const selectable=[],ray=new THREE.Raycaster(),mouse=new THREE.Vector2();bodies.forEach(b=>{const pts=[];for(let k=0;k<=128;k++){const a=k/128*TAU;pts.push(new THREE.Vector3(Math.cos(a)*b.r,0,Math.sin(a)*b.r))}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.18})));const m=new THREE.Mesh(new THREE.SphereGeometry(b.size,32,20),new THREE.MeshLambertMaterial({color:b.c}));m.userData.body=b;scene.add(m);b.mesh=m;selectable.push(m);const l=document.createElement('div');l.className='label';l.textContent=b.n;labelsBox.appendChild(l);b.label=l;if(b.n==='Saturne'){const ring=new THREE.Mesh(new THREE.RingGeometry(3.1,4.5,64),new THREE.MeshBasicMaterial({color:0xcdbb91,side:THREE.DoubleSide,transparent:true,opacity:.7,depthWrite:false}));ring.rotation.x=Math.PI/2;m.add(ring)}});let day=(Date.now()-J2000)/864e5,playing=true,showLabels=false,theme='night',selected=null,az=.65,elev=.58,dist=230,target=new THREE.Vector3(),drag=false,last={x:0,y:0},moved=0;function placeCamera(){camera.position.set(target.x+Math.sin(az)*Math.cos(elev)*dist,target.y+Math.sin(elev)*dist,target.z+Math.cos(az)*Math.cos(elev)*dist);camera.lookAt(target);compass.style.transform=`rotate(${-az}rad)`;zoomText.textContent=dist<180?'×'+(230/dist).toFixed(1):''}function angleAt(b,d){return b.L*Math.PI/180+TAU*d/(b.p*365.25)}function formatDay(){return new Date(J2000+day*864e5).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}function setSelected(b){selected=b||null;back.style.display=selected?'grid':'none';iname.textContent=selected?selected.n:'Système solaire';sub.textContent=selected?selected.a.toFixed(2).replace('.',',')+' UA du Soleil':'Vue d’ensemble';if(selected)dist=Math.min(dist,42)}function reset(){selected=null;target.set(0,0,0);az=.65;elev=.58;dist=230;setSelected(null)}function renderLabels(){bodies.forEach(b=>{if(!showLabels){b.label.style.display='none';return}const v=b.mesh.position.clone().project(camera);const ok=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;b.label.style.display=ok?'block':'none';if(ok){b.label.style.left=(v.x*.5+.5)*innerWidth+'px';b.label.style.top=(-v.y*.5+.5)*innerHeight+'px'}})}let t0=performance.now();function frame(t){const dt=Math.min(.05,(t-t0)/1000);t0=t;if(playing)day+=1.6*dt;bodies.forEach(b=>{const a=angleAt(b,day);b.mesh.position.set(Math.cos(a)*b.r,0,Math.sin(a)*b.r);b.mesh.rotation.y+=dt*.2});if(selected)target.lerp(selected.mesh.position,.08);placeCamera();renderLabels();handle.textContent=formatDay();renderer.render(scene,camera);requestAnimationFrame(frame)}function pointer(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1}renderer.domElement.addEventListener('pointerdown',e=>{drag=true;last={x:e.clientX,y:e.clientY};moved=0;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);az-=dx*.007;elev=Math.max(.12,Math.min(1.35,elev-dy*.005))});renderer.domElement.addEventListener('pointerup',e=>{drag=false;if(moved<8){pointer(e);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(selectable,false)[0];if(hit)setSelected(hit.object.userData.body)}});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(18,Math.min(360,dist*(e.deltaY>0?1.14:.88)))},{passive:false});document.getElementById('zin').onclick=()=>dist=Math.max(18,dist*.72);document.getElementById('zout').onclick=()=>dist=Math.min(360,dist*1.35);document.getElementById('reset').onclick=reset;back.onclick=reset;document.getElementById('now').onclick=()=>day=(Date.now()-J2000)/864e5;document.getElementById('toggleLabels').onclick=()=>showLabels=!showLabels;document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'Ⅱ':'▶'};document.getElementById('theme').onclick=()=>{theme=theme==='night'?'day':'night';app.className=theme==='day'?'day':''};document.getElementById('timeline').addEventListener('pointerdown',e=>{const r=e.currentTarget.getBoundingClientRect();day+=(e.clientY-r.top-r.height/2)/r.height*800;playing=false;document.getElementById('play').textContent='▶'});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});placeCamera();boot.remove();requestAnimationFrame(frame)})();
</script></body></html>
