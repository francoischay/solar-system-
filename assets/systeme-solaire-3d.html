<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#070a24" />
    <title>Système solaire 3D</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          sans-serif;
        color: #fff;
        background: #11143f;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      #app {
        position: fixed;
        inset: 0;
        isolation: isolate;
        background:
          radial-gradient(
            circle at 12% 86%,
            rgba(130, 75, 235, 0.68),
            transparent 35%
          ),
          radial-gradient(
            circle at 80% 18%,
            rgba(49, 60, 181, 0.24),
            transparent 34%
          ),
          linear-gradient(155deg, #11133d 0%, #171858 48%, #292064 100%);
        touch-action: none;
        transition: background 0.8s ease;
      }
      #app:after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(5, 6, 35, 0.2),
          transparent 30%,
          rgba(15, 10, 58, 0.08) 65%,
          rgba(89, 45, 174, 0.16)
        );
        mix-blend-mode: screen;
      }
      #app.day {
        background:
          radial-gradient(
            circle at 20% 68%,
            rgba(255, 245, 176, 0.85),
            transparent 38%
          ),
          linear-gradient(155deg, #bfd7db, #e9e9c6 58%, #f7cb61);
      }
      canvas {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .glass {
        background: linear-gradient(
          145deg,
          rgba(122, 118, 225, 0.26),
          rgba(31, 32, 92, 0.3)
        );
        border: 1px solid rgba(190, 194, 255, 0.3);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 8px 28px rgba(4, 5, 28, 0.18);
        backdrop-filter: blur(22px) saturate(135%);
        -webkit-backdrop-filter: blur(22px) saturate(135%);
        color: #fff;
      }
      .btn {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 650;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.22);
        transition:
          transform 0.18s ease,
          background 0.18s ease;
      }
      .btn:active {
        transform: scale(0.96);
        background: rgba(142, 134, 239, 0.42);
      }
      .stack {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .top {
        top: calc(16px + env(safe-area-inset-top));
        z-index: 4;
      }
      .left {
        left: 16px;
      }
      .right {
        right: 16px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .pill {
        border: 1px solid rgba(255, 255, 255, 0.38);
        min-height: 34px;
        border-radius: 18px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 700;
      }
      .controls {
        top: calc(88px + env(safe-area-inset-top));
        left: 16px;
        z-index: 4;
      }
      .controls .btn {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
      .dock {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: calc(14px + env(safe-area-inset-bottom));
        display: flex;
        gap: 12px;
        align-items: flex-end;
        z-index: 4;
      }
      .dock .btn {
        width: 58px;
        height: 58px;
        font-size: 21px;
      }
      .info {
        flex: 1;
        min-width: 0;
        height: 58px;
        border-radius: 29px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 9px 18px 14px;
        overflow: hidden;
        touch-action: pan-y;
      }
      .info.spacecraft-info { cursor:pointer; }
      .info {
        --sheet-progress: 0;
        --sheet-offset: 8px;
        position: relative;
        transition-property: height, border-radius;
        transition-duration: 320ms;
        transition-timing-function: cubic-bezier(.2, 0, 0, 1);
      }
      .info.dragging { transition-duration: 0ms; }
      .info.expanded {
        border-radius: 22px;
      }
      .sheet-grabber {
        position: absolute;
        left: 50%;
        top: 0;
        z-index: 1;
        width: 64px;
        height: 40px;
        border: 0;
        padding: 0;
        background: transparent;
        transform: translateX(-50%);
        touch-action: none;
        cursor: ns-resize;
      }
      .sheet-grabber:after {
        content: "";
        position: absolute;
        left: 14px;
        top: 5px;
        width: 36px;
        height: 5px;
        border-radius: 3px;
        background: rgba(255,255,255,.34);
      }
      .info:not(.has-detail) .sheet-grabber { opacity: 0; pointer-events: none; }
      .info-header {
        width: 100%;
        min-height: 40px;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 2px;
        touch-action: none;
        cursor: ns-resize;
      }
      .info.has-detail .info-header { padding-right: 30px; padding-left: 30px; }
      .detail {
        display: block;
        width: 100%;
        min-height: 0;
        margin: 10px 2px 0;
        padding: 0 0 4px;
        overflow-y: auto;
        font-size: 12.5px;
        line-height: 1.55;
        font-weight: 480;
        text-align: left;
        color: rgba(255,255,255,.74);
        opacity: var(--sheet-progress);
        transform: translateY(var(--sheet-offset));
        pointer-events: none;
        scrollbar-width: none;
        text-wrap: pretty;
        transition-property: opacity, transform;
        transition-duration: 180ms;
        transition-timing-function: cubic-bezier(.2, 0, 0, 1);
      }
      .detail::-webkit-scrollbar { display: none; }
      .info.expanded .detail { pointer-events: auto; }
      .info.hidden { visibility: hidden; }
      .date-link {
        margin: 0;
        padding: 0 1px;
        border: 0;
        background: none;
        color: #dbe6ff;
        font: inherit;
        font-weight: 620;
        text-decoration: underline dotted currentColor;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      .date-link:hover, .date-link:active { color: #fff; text-decoration-style: solid; }
      .detail-toggle {
        display: none;
        position: absolute;
        right: 8px;
        top: 11px;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 20px;
        background: rgba(255,255,255,.1);
        color: inherit;
        font-size: 13px;
        line-height: 1;
        opacity: .75;
        transition-property: transform, background-color;
        transition-duration: 280ms, 160ms;
        transition-timing-function: cubic-bezier(.2, 0, 0, 1), ease-out;
      }
      .info.has-detail .detail-toggle { display: block; }
      .info.expanded .detail-toggle { transform: rotate(180deg); }
      .detail-toggle:active { background: rgba(255,255,255,.18); transform: scale(.96); }
      .info.expanded .detail-toggle:active { transform: rotate(180deg) scale(.96); }
      .name {
        font-size: 16px;
        font-weight: 680;
        letter-spacing: -0.2px;
      }
      .sub {
        margin-top: 2px;
        font-size: 12px;
        font-weight: 520;
        opacity: 0.58;
      }
      .labels {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      .label {
        position: absolute;
        transform: translate(-50%, -145%);
        display: none;
        padding: 5px 9px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.92);
        color: #17183d;
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 5px 18px rgba(6, 7, 35, 0.22);
      }
      .timeline {
        position: absolute;
        right: 25px;
        top: 132px;
        bottom: 112px;
        width: 1px;
        background: linear-gradient(
          transparent,
          rgba(205, 207, 255, 0.34) 12%,
          rgba(205, 207, 255, 0.34) 88%,
          transparent
        );
        z-index: 4;
      }
      .timeline:before,
      .timeline:after {
        content: "";
        position: absolute;
        left: 50%;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1px solid rgba(205, 207, 255, 0.42);
        background: #24215d;
        transform: translateX(-50%);
      }
      .timeline:before {
        top: 14%;
      }
      .timeline:after {
        bottom: 14%;
      }
      .handle {
        position: absolute;
        right: -11px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.96);
        color: #17183d;
        border-radius: 18px;
        padding: 8px 11px;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 750;
        box-shadow: 0 8px 24px rgba(8, 8, 40, 0.2);
        z-index: 7;
        transition: transform .16s cubic-bezier(.22,.61,.36,1), box-shadow .16s ease;
      }
      .handle.dragging { /* sort de sous le doigt pendant le glissement */
        transform: translateY(-50%) translateX(-72px) scale(1.06);
        box-shadow: 0 12px 30px rgba(8, 8, 40, 0.34);
      }
      .boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 4;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.2px;
        opacity: 0.7;
      }
      .browser {
        position: absolute;
        z-index: 8;
        left: 16px;
        right: 16px;
        bottom: calc(80px + env(safe-area-inset-bottom));
        max-height: min(54vh, 460px);
        display: flex;
        flex-direction: column;
        border-radius: 24px;
        padding: 6px 6px 0;
        pointer-events: auto;
        transform-origin: bottom left;
        animation: pop .18s ease-out;
      }
      .browser.closed { display: none; }
      .browser.glass { /* la liste doit rester lisible même au-dessus du halo du Soleil */
        background: linear-gradient(160deg, rgba(46,44,120,.93), rgba(20,21,66,.95));
      }
      @media (min-width: 640px) { .browser { right: auto; width: 380px; } }
      .browser-head { display: flex; align-items: center; gap: 6px; padding: 2px 2px 7px; }
      .browser-tabs { flex: 1; display: flex; gap: 3px; padding: 3px; border-radius: 16px; background: rgba(11,13,52,.34); }
      .browser-tabs .explore-tab {
        flex: 1; min-width: 0; border: 0; border-radius: 13px; padding: 9px 4px;
        color: rgba(255,255,255,.6); background: transparent; font-size: 11.5px; font-weight: 760;
      }
      .browser-tabs .explore-tab.active { color: #222452; background: #f4f2ff; }
      .browser-close { flex: none; width: 34px; height: 34px; border: 0; border-radius: 17px; background: rgba(255,255,255,.1); color: #fff; font-size: 18px; line-height: 1; }
      .browser-body { overflow-y: auto; padding: 0 9px 10px; scrollbar-width: none; }
      .browser-body::-webkit-scrollbar { display: none; }
      .browser-list.closed { display: none; }
      .mission-panel.closed { display:none; }
      .mission-toggle {
        position:absolute; left:16px; top:calc(16px + env(safe-area-inset-top)); z-index:6;
        min-height:42px; border:1px solid rgba(190,194,255,.3); border-radius:21px;
        padding:0 15px; background:rgba(34,34,101,.58); color:white; font-size:12px;
        font-weight:760; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      }
      .pop-menu {
        position:absolute; z-index:8; left:16px;
        bottom:calc(80px + env(safe-area-inset-bottom));
        display:flex; flex-direction:column; gap:2px; padding:5px; border-radius:20px;
        transform-origin:bottom left; animation:pop .16s ease-out;
      }
      .pop-menu.right { left:auto; right:16px; transform-origin:bottom right; }
      .pop-menu.closed { display:none; }
      @keyframes pop { from { opacity:0; transform:scale(.92) translateY(6px); } }
      .pop-menu button { min-width:118px; border:0; border-radius:15px; padding:10px 13px; color:rgba(255,255,255,.68); background:transparent; font-size:12px; font-weight:740; text-align:left; }
      .pop-menu.right button { min-width:92px; }
      .pop-menu button.active { color:#222452; background:#f4f2ff; }
      .dock-round {
        flex:none; width:46px; height:46px; padding:0; border:0; border-radius:23px;
        color:rgba(255,255,255,.9); font-size:15px; font-weight:760; line-height:1;
      }
      .dock-round.open { color:#222452; background:#f4f2ff; }
      .data-panel { position:absolute; left:16px; top:calc(16px + env(safe-area-inset-top)); z-index:6; width:min(344px,calc(100vw - 76px)); max-height:min(440px,calc(100vh - 145px)); overflow:auto; border-radius:22px; padding:15px; scrollbar-width:none; }
      .data-panel::-webkit-scrollbar { display:none; }
      .data-panel.closed { display:none; }
      .panel-kicker { color:#aeb7ff; font-size:10px; font-weight:800; letter-spacing:1.25px; text-transform:uppercase; }
      .panel-title { margin:3px 0 12px; font-size:18px; font-weight:780; letter-spacing:-.35px; }
      .object-card { width:100%; display:flex; align-items:center; gap:11px; border:0; border-radius:15px; padding:10px; margin-top:7px; color:white; background:rgba(11,13,52,.28); text-align:left; }
      .object-card.selected { color:#252552; background:#f4f2ff; }
      .object-icon { width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:11px; color:#151839; background:var(--accent,#9de9ff); font-size:17px; font-weight:800; }
      .object-copy { min-width:0; flex:1; }
      .object-name { display:block; font-size:12px; font-weight:760; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .object-meta { display:block; margin-top:3px; font-size:9px; font-weight:630; opacity:.58; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .launch-time { flex:none; text-align:right; }
      .launch-count { display:block; color:#9ff3dc; font-size:10px; font-weight:800; }
      .object-card.selected .launch-count { color:#3c7a6d; }
      .launch-date { display:block; margin-top:3px; font-size:9px; opacity:.55; }
      .panel-note { margin:11px 2px 0; color:rgba(255,255,255,.48); font-size:9px; line-height:1.4; }
      .live-dot { display:inline-block; width:6px; height:6px; margin-right:5px; border-radius:50%; background:#70efc7; box-shadow:0 0 10px #70efc7; }
      .mission-toggle { display:none !important; }
      .mission-close { flex:none; width:30px; height:30px; border:0; border-radius:50%; background:rgba(255,255,255,.1); color:white; font-size:17px; line-height:1; }
      .mission-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
      .mission-kicker { color:#aeb7ff; font-size:10px; font-weight:800; letter-spacing:1.25px; text-transform:uppercase; }
      .mission-title { margin-top:3px; font-size:16px; font-weight:760; letter-spacing:-.25px; }
      .mission-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-top:9px; padding-bottom:2px; scrollbar-width:none; }
      .mission-list::-webkit-scrollbar { display:none; }
      .mission-chip { min-width:0; border:0; border-radius:12px; padding:8px 10px; background:rgba(12,14,55,.3); color:rgba(255,255,255,.8); text-align:left; }
      .mission-chip-name { display:block; font-size:11px; font-weight:720; white-space:nowrap; }
      .mission-chip-dates { display:block; margin-top:3px; color:rgba(255,255,255,.48); font-size:9px; font-weight:620; }
      .mission-chip.selected { background:#f4f2ff; color:#252552; }
      .mission-chip.selected .mission-chip-dates { color:rgba(37,37,82,.58); }
      .mission-display-toggle { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; color:rgba(255,255,255,.72); font-size:11px; font-weight:680; }
      .switch { position:relative; width:38px; height:22px; flex:none; }
      .switch input { position:absolute; opacity:0; pointer-events:none; }
      .switch-track { position:absolute; inset:0; border-radius:12px; background:rgba(255,255,255,.16); transition:.2s; }
      .switch-track:after { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; border-radius:50%; background:#d9dcff; transition:.2s; }
      .switch input:checked + .switch-track { background:#766ff0; }
      .switch input:checked + .switch-track:after { transform:translateX(16px); background:white; }
      .spacecraft-label { background:rgba(22,27,68,.92); color:#fff; border:1px solid rgba(128,225,255,.42); }
      @media (max-width: 560px) {
        .mission-meta span:first-child { display:none; }
        .mission-panel, .data-panel {
          left:16px; right:16px; width:auto; padding:13px;
          top:calc(16px + env(safe-area-inset-top));
          max-height:calc(100vh - 190px);
        }
        .mission-chip-name { font-size:10.5px; }
      }
      @media (min-width: 700px) {
        .dock {
          left: 24px;
          right: 24px;
          bottom: 24px;
        }
        .top.left {
          left: 24px;
        }
        .top.right {
          right: 24px;
        }
        .controls {
          left: 24px;
        }
      }

      .top,
      .controls,
      .dock > .btn {
        display: none !important;
      }
      .dock {
        left: 18%;
        right: 18%;
        justify-content: center;
      }
      .dock .info {
        flex: 1;
        width: 100%;
      }
      @media (min-width: 700px) {
        .dock {
          left: 28%;
          right: 28%;
        }
      }
      .timeline {
        right: 8px;
        width: 54px;
        background: none;
      }
      .timeline:before,
      .timeline:after {
        display: none;
      }
      .handle {
        right: 0;
      }
      .today-return {
        display: none;
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        transition: opacity .18s ease;
        z-index: 6;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 18px;
        padding: 8px 12px;
        background: rgba(35, 31, 98, 0.72);
        color: white;
        font-size: 12px;
        font-weight: 720;
        white-space: nowrap;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .dock {
        display: flex;
        left: 16px;
        right: 16px;
        gap: 10px;
        justify-content: space-between;
      }
      .timeline {
        pointer-events: none;
      }
      .scale-control {
        position: absolute;
        right: 12px;
        bottom: calc(20px + env(safe-area-inset-bottom));
        z-index: 6;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px;
        border-radius: 17px;
        pointer-events: auto;
      }
      .scale-control button {
        min-width: 30px;
        height: 25px;
        padding: 0 5px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: rgba(255, 255, 255, 0.5);
        font-size: 10px;
        font-weight: 780;
        letter-spacing: 0.3px;
        transition: color .2s ease, background .2s ease;
      }
      .scale-control button.active {
        color: #222452;
        background: #f4f2ff;
      }
      .handle,
      .today-return {
        pointer-events: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" class="boot">Chargement du système…</div>
      <div id="labels" class="labels"></div>
      <button id="missionToggle" class="mission-toggle" aria-expanded="false">✦ Sondes</button>
      <section id="browser" class="browser glass closed" aria-label="Explorer">
        <header class="browser-head">
          <div class="browser-tabs">
            <button class="explore-tab" data-view="missions">Sondes</button>
            <button class="explore-tab" data-view="satellites">Satellites</button>
            <button class="explore-tab" data-view="launches">Lancements</button>
          </div>
          <button id="missionClose" class="browser-close" aria-label="Fermer">×</button>
        </header>
        <div class="browser-body">
          <div id="missionPanel" class="browser-list closed">
            <div id="missionList" class="mission-list"></div>
            <label class="mission-display-toggle"><span>Afficher toutes les sondes</span><span class="switch"><input id="showAllMissions" type="checkbox" /><span class="switch-track"></span></span></label>
          </div>
          <div id="satellitePanel" class="browser-list closed">
            <div id="satelliteList"></div>
            <label class="mission-display-toggle"><span>Afficher tous les satellites</span><span class="switch"><input id="showAllSatellites" type="checkbox" /><span class="switch-track"></span></span></label>
            <div class="panel-note">Positions calculées localement · orbites illustratives</div>
          </div>
          <div id="launchPanel" class="browser-list closed">
            <div id="launchList"></div>
            <div class="panel-note">Fenêtres indicatives · trajectoire non télémétrique</div>
          </div>
        </div>
      </section>
      <div id="compass" class="top left btn glass">N</div>
      <div class="top right row">
        <button
          class="btn glass"
          id="toggleLabels"
          aria-label="Afficher les noms"
        >
          ◫</button
        ><button class="btn glass" id="reset" aria-label="Réinitialiser">
          •••
        </button>
      </div>
      <div class="controls stack">
        <button class="btn glass" id="zin" aria-label="Zoomer">+</button
        ><button class="btn glass" id="zout" aria-label="Dézoomer">−</button
        ><button
          class="btn glass"
          id="back"
          aria-label="Retour"
          style="display: none"
        >
          ↩
        </button>
      </div>
      <button id="now" class="top left pill glass" style="top: 76px">
        Aujourd’hui

              return true;
            };
            const hits = ray.intersectObjects(selectable, false).filter(h => visibleInScene(h.object));
            hits.sort((a,b) => {
              const priority=(hit) => hit.object.userData.body?.isMoon ? 0 : hit.object.userData.body?.isSpacecraft ? 1 : 2;
              return priority(a)-priority(b) || a.distance-b.distance;
            });
            const hit = hits[0];
            if (hit) {
              const hitBody=hit.object.userData.body;
              if(hitBody!==selected) setSelected(hitBody);
            } else if(selected) reset();
          }
        });
        renderer.domElement.addEventListener("pointercancel", (e) => {
          activePointers.delete(e.pointerId); pinching=false; drag=false;
        });
        renderer.domElement.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            goalDist = Math.max(
              1.4,
              Math.min(560, goalDist * (e.deltaY > 0 ? 1.14 : 0.88)),
            );
          },
          { passive: false },
        );
        document.getElementById("zin").onclick = () =>
          (goalDist = Math.max(1.4, goalDist * 0.72));
        document.getElementById("zout").onclick = () =>
          (goalDist = Math.min(560, goalDist * 1.35));
        document.getElementById("reset").onclick = reset;
        back.onclick = reset;
        document.getElementById("now").onclick = () => {
          const targetDay=(Date.now()-J2000)/864e5;
          animateDateTo(targetDay,HANDLE_REST,restCenter(targetDay));
        };
        document.getElementById("toggleLabels").onclick = () =>
          (showLabels = !showLabels);
        document.getElementById("play").onclick = function () {
          playing = !playing;
          this.textContent = playing ? "Ⅱ" : "▶";
        };
        document.getElementById("theme").onclick = function () {
          theme = theme === "night" ? "day" : "night";
          app.className = theme === "day" ? "day" : "";
          this.textContent = theme === "day" ? "◐" : "☼";
        };
        const timeline = document.getElementById("timeline"),
          todayReturn = document.getElementById("todayReturn"),
          todayDay = (Date.now() - J2000) / 864e5;
        let dayRange = 100, // la course du curseur vaut 100 pas de l'unité choisie
          timelineCenter = todayDay,
          edgeTimer = null,
          edgeDirection = 0,
          dragStartY = 0,
          dragStartP = 0.5,
          timelineVelocity = 0,
          lastSlideDay = day,
          lastSlideTime = 0,
          inertiaFrame = null,
          dateTransitionFrame = null;
        function stopDateTransition() {
          if(dateTransitionFrame) cancelAnimationFrame(dateTransitionFrame);
          dateTransitionFrame=null;
        }
        const HANDLE_REST=62; // le curseur se pose sous le bouton « Aujourd'hui », qui garde le milieu
        function restCenter(targetDay) { return targetDay-(HANDLE_REST/100-0.5)*dayRange; }
        function animateDateTo(targetDay,targetTop,targetCenter) {
          stopTimelineInertia(); stopDateTransition(); stopEdge();
          const startDay=day, startCenter=timelineCenter,
            startTop=parseFloat(handle.style.top||"50"), startTime=performance.now(), duration=950;
          function transition(now) {
            const p=Math.min(1,(now-startTime)/duration), eased=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
            day=startDay+(targetDay-startDay)*eased;
            timelineCenter=startCenter+(targetCenter-startCenter)*eased;
            handle.style.top=(startTop+(targetTop-startTop)*eased)+"%";
            if(p<1) dateTransitionFrame=requestAnimationFrame(transition);
            else dateTransitionFrame=null;
          }
          dateTransitionFrame=requestAnimationFrame(transition);
        }
        function stopTimelineInertia() {
          if(inertiaFrame) cancelAnimationFrame(inertiaFrame);
          inertiaFrame=null; timelineVelocity=0;
        }
        function startTimelineInertia() {
          if(Math.abs(timelineVelocity)<0.003) return;
          let lastTime=performance.now();
          function coast(now) {
            const elapsed=Math.min(32,now-lastTime); lastTime=now;
            day+=timelineVelocity*elapsed; timelineCenter+=timelineVelocity*elapsed;
            timelineVelocity*=Math.exp(-0.0045*elapsed);
            if(Math.abs(timelineVelocity)>0.001) inertiaFrame=requestAnimationFrame(coast);
            else stopTimelineInertia();
          }
          inertiaFrame=requestAnimationFrame(coast);
        }
        function stopEdge() {
          if (edgeTimer) clearInterval(edgeTimer);
          edgeTimer = null;
          edgeDirection = 0;
        }
        function startEdge(direction) {
          if (direction === edgeDirection) return;
          stopEdge();
          edgeDirection = direction;
          if (direction)
            edgeTimer = setInterval(() => {
              const step = direction * dayRange / 200; // même vitesse relative quelle que soit l'échelle
              day += step;
              timelineCenter += step;
            }, 45);
        }
        function slideDate(e) {
          const r = timeline.getBoundingClientRect(),
            p = Math.max(
              0,
              Math.min(1, dragStartP + (e.clientY - dragStartY) / r.height),
            );
          const nextDay = timelineCenter + (p - 0.5) * dayRange,
            now = performance.now(), elapsed = Math.max(1,now-lastSlideTime),
            instantVelocity = (nextDay-lastSlideDay)/elapsed;
          const maxVelocity=dayRange/4000; // l'élan reste proportionnel au pas choisi
          timelineVelocity=Math.max(-maxVelocity,Math.min(maxVelocity,timelineVelocity*.55+instantVelocity*.45));
          day = nextDay; lastSlideDay=day; lastSlideTime=now;
          handle.style.top = p * 100 + "%";
          startEdge(p < 0.025 ? -1 : p > 0.975 ? 1 : 0);
        }
        timeline.addEventListener("pointerdown", (e) => {
          if (e.target !== handle) return;
          stopDateTransition();
          stopTimelineInertia();
          handle.classList.add("dragging");
          dragStartY = e.clientY;
          dragStartP = parseFloat(handle.style.top || "50") / 100;
          lastSlideDay=day; lastSlideTime=performance.now();
          timeline.setPointerCapture(e.pointerId);
        });
        timeline.addEventListener("pointermove", (e) => {
          if (timeline.hasPointerCapture(e.pointerId)) slideDate(e);
        });
        timeline.addEventListener("pointerup", (e) => {
          handle.classList.remove("dragging");
          stopEdge();
          if (timeline.hasPointerCapture(e.pointerId))
            timeline.releasePointerCapture(e.pointerId);
          startTimelineInertia();
        });
        timeline.addEventListener("pointercancel", () => { handle.classList.remove("dragging"); stopEdge(); stopTimelineInertia(); });
        const scaleMenu = document.getElementById("scaleMenu"),
          scaleTrigger = document.getElementById("scaleTrigger"),
          VIEW_GLYPH = { none:"◎", missions:"✦", satellites:"▣", launches:"↑" };
        function openMenu(menu, trigger, open) {
          menu.classList.toggle("closed", !open);
          trigger.classList.toggle("open", open);
        }
        function closeMenus() { openMenu(scaleMenu, scaleTrigger, false); }
        viewTrigger.onclick = (e) => {
          e.stopPropagation();
          closeMenus();
          setExploreView(browser.classList.contains("closed") ? lastView : "none");
        };
        scaleTrigger.onclick = (e) => {
          e.stopPropagation();
          const open = scaleMenu.classList.contains("closed");
          closeMenus(); openMenu(scaleMenu, scaleTrigger, open);
        };
        [...scaleMenu.children].forEach((button) => {
          button.onclick = () => { // on garde la date courante et on recentre la course dessus
            stopDateTransition(); stopTimelineInertia(); stopEdge();
            dayRange = Number(button.dataset.range);
            timelineCenter = restCenter(day);
            handle.style.top = HANDLE_REST + "%";
            [...scaleMenu.children].forEach(b => b.classList.toggle("active", b === button));
            scaleTrigger.textContent = button.dataset.short;
            closeMenus();
          };
        });
        todayReturn.addEventListener("pointerdown", (e) => e.stopPropagation());
        todayReturn.addEventListener("click", () => {
          const targetDay=(Date.now()-J2000)/864e5;
          animateDateTo(targetDay,HANDLE_REST,restCenter(targetDay));
          todayReturn.style.display = "none";
        });
        addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
          selectionInfo.style.height=(sheetProgressTarget?sheetMaxHeight():SHEET_MIN_HEIGHT)+"px";
        });
        snapSheet(false,false);
        placeCamera();
        loadSatelliteElements(); // après l'initialisation de `day`
        loadLaunches();
        renderSatelliteList(); renderLaunchList(); setInterval(renderLaunchList,60000);
        renderMissionList();
        boot.remove();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
